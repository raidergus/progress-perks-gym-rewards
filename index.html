iv><div class="avatar">${view==='member'?member().initials:'SC'}</div></div></header>${content}<nav class="mobile-nav"><button class="${view==='member'?'active':''}" onclick="setView('member')">${icons.home}Home</button><button onclick="setView('member');setTimeout(()=>document.getElementById('challenges')?.scrollIntoView({behavior:'smooth'}),40)">${icons.trophy}Challenges</button><button class="${view==='admin'?'active':''}" onclick="setView('admin')">${icons.users}Members</button><button onclick="setView('admin');setTimeout(()=>document.getElementById('manage-rewards')?.scrollIntoView({behavior:'smooth'}),40)">${icons.gift}Rewards</button></nav></main></div>`}
function renderMember(){let m=member();let active=data.challenges.filter(c=>c.active);let acts=data.activity.slice(0,4);return shell(`<section class="page"><div class="hello-row"><div><div class="overline">THURSDAY, NOVEMBER 5, 2026</div><h1>Hey, ${esc(m.name.split(' ')[0])} <span>👋</span></h1><div class="subhead">A little progress goes a long way. Let's move.</div></div><div class="date-chip">📍 &nbsp;Your club activity</div></div><div class="hero"><div class="hero-copy"><div class="hero-kicker">MEMBER REWARDS</div><h2>Good habits.<br>Great rewards.</h2><p>Show up, take on a challenge, and turn your effort into something extra.</p><button class="btn-lime" onclick="document.getElementById('challenges').scrollIntoView({behavior:'smooth'})">Explore challenges&nbsp; ↗</button></div><div class="hero-score"><div class="score-ring"><div><div class="score-num">${m.points}</div><div class="score-unit">POINTS</div></div></div><div class="score-note">${m.tier.toUpperCase()} MEMBER&nbsp; · &nbsp;${Math.max(0,1000-m.points)} TO NEXT TIER</div></div></div><div class="stats"><div class="stat"><div class="stat-top">Visits this month <span class="stat-icon">↗</span></div><div class="stat-num">${m.visits}</div><div class="stat-foot"><em>+3</em> from last month</div></div><div class="stat"><div class="stat-top">Challenges done <span class="stat-icon">✳</span></div><div class="stat-num">${data.activity.filter(a=>a.title.includes('Challenge')).length+3}</div><div class="stat-foot">You're building momentum</div></div><div class="stat"><div class="stat-top">Rewards claimed <span class="stat-icon">♧</span></div><div class="stat-num">${data.redemptions.filter(r=>r.memberId===m.id).length}</div><div class="stat-foot">Your effort, your perks</div></div><div class="stat"><div class="stat-top">Member status <span class="stat-icon">✧</span></div><div class="stat-num">${m.tier}</div><div class="stat-foot">Keep showing up</div></div></div><div class="section-head" id="challenges"><h2>Challenges for you <span style="color:#98a298;font:400 11px 'DM Sans'">· ${active.length} active</span></h2><button class="text-btn" onclick="openChallengeModal()">+ New challenge</button></div><div class="challenge-grid">${active.length?active.map(c=>{let p=c.progress||0,done=p>=c.goal;return `<article class="challenge"><div class="challenge-top"><div class="challenge-icon">${c.icon}</div><span class="pill">${done?'COMPLETED':'IN PROGRESS'}</span></div><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><div class="progress-track"><i style="width:${Math.min(100,p/c.goal*100)}%"></i></div><div class="challenge-bottom"><span class="progress-text">${p} / ${c.goal} completed</span><span class="reward-points">+${c.points} pts</span><button class="do-btn" ${done?'disabled':''} onclick="advanceChallenge(${c.id})">${done?'✓ Done':'+ Log'}</button></div></article>`}).join(''):'<div class="empty">No active challenges yet.</div>'}</div><div class="lower-grid"><div class="panel"><div class="panel-title"><h3>Recent activity</h3><button class="text-btn" onclick="toast('You\'re all caught up')">View all</button></div>${acts.map(a=>`<div class="activity"><div class="act-icon">${a.icon}</div><div><div class="act-text">${esc(a.title)}</div><div class="act-meta">${esc(a.meta)}</div></div><div class="act-points">${a.points} pts</div></div>`).join('')||'<div class="empty">Your activity will show up here.</div>'}</div><div class="panel"><div class="panel-title"><h3>Rewards to redeem</h3><button class="text-btn" onclick="toast('Showing available rewards')">See all</button></div><div class="reward-list">${data.rewards.map(r=>`<div class="reward"><div class="reward-icon">${r.icon}</div><div><div class="reward-name">${esc(r.name)}</div><div class="reward-desc">${r.cost} pts · ${r.stock} left</div></div><button class="redeem" ${m.points<r.cost||!r.stock?'disabled':''} onclick="redeem(${r.id})">Redeem</button></div>`).join('')}</div></div></div></section>`)}
function renderAdmin(){let total=data.members.length,points=data.members.reduce((s,m)=>s+m.points,0),redeems=data.redemptions.length;return shell(`<section class="page"><div class="hello-row"><div><div class="overline">SUMMIT CLUB · WORKSPACE</div><h1>Club dashboard</h1><div class="subhead">Your member community is showing up. Keep the momentum going.</div></div><div class="date-chip">● &nbsp;Workspace active</div></div><div class="admin-banner"><div><b>Welcome to your rewards workspace</b><br><span>Track member activity, set challenges, and celebrate progress.</span></div><button class="primary" onclick="openChallengeModal()">＋ Create challenge</button></div><div class="admin-stats"><div class="stat"><div class="stat-top">Active members <span class="stat-icon">♙</span></div><div class="stat-num">${total}</div><div class="stat-foot"><em>+12%</em> this month</div></div><div class="stat"><div class="stat-top">Points in circulation <span class="stat-icon">✳</span></div><div class="stat-num">${points.toLocaleString()}</div><div class="stat-foot">Across all members</div></div><div class="stat"><div class="stat-top">Active challenges <span class="stat-icon">⚑</span></div><div class="stat-num">${data.challenges.filter(c=>c.active).length}</div><div class="stat-foot">${data.challenges.length} total created</div></div><div class="stat"><div class="stat-top">Rewards redeemed <span class="stat-icon">♧</span></div><div class="stat-num">${redeems}</div><div class="stat-foot">All time</div></div></div><div class="table-wrap"><div class="table-head"><h3>Member overview</h3><button class="primary" onclick="openMemberModal()">＋ Add member</button></div><table class="table"><thead><tr><th>Member</th><th>Visits</th><th>Points balance</th><th>Tier</th><th>Actions</th></tr></thead><tbody>${data.members.map(m=>`<tr><td><div class="member-cell"><div class="mini-avatar">${esc(m.initials)}</div><div>${esc(m.name)}<div class="member-email">${esc(m.email)}</div></div></div></td><td>${m.visits}</td><td class="points-cell">${m.points} pts</td><td><span class="tag ${m.tier==='Bronze'?'orange':''}">${m.tier}</span></td><td><button class="small-btn" onclick="adjustPoints(${m.id})">Adjust points</button></td></tr>`).join('')}</tbody></table></div><div class="admin-bottom"><div class="panel" id="manage-rewards"><div class="panel-title"><h3>Reward catalog</h3><button class="text-btn" onclick="openRewardModal()">+ Add reward</button></div>${data.rewards.map(r=>`<div class="manage-row"><div><b>${r.icon} &nbsp;${esc(r.name)}</b><small>${r.cost} pts · ${r.stock} in stock</small></div><div class="row-actions"><button class="small-btn" onclick="editReward(${r.id})">Edit</button><button class="small-btn" onclick="deleteReward(${r.id})">×</button></div></div>`).join('')||'<div class="empty">Add a reward to get started.</div>'}</div><div class="panel"><div class="panel-title"><h3>Challenges</h3><button class="text-btn" onclick="openChallengeModal()">+ Add</button></div><div class="challenge-admin">${data.challenges.map(c=>`<div class="admin-challenge"><strong>${c.icon} &nbsp;${esc(c.title)}</strong><p>${c.active?'Active':'Paused'} · ${c.points} pts · ${c.goal} steps</p></div>`).join('')||'<div class="empty">No challenges yet.</div>'}</div></div></div></section>`)}function render(){document.getElementById('root').innerHTML=view==='member'?renderMember():renderAdmin()}function setView(v){view=v;render();window.scrollTo(0,0)}
function advanceChallenge(id){let c=data.challenges.find(x=>x.id===id),m=member();if(!c||c.progress>=c.goal)return;c.progress++;m.points+=Math.round(c.points/c.goal);data.activity.unshift({icon:c.icon,title:c.title,meta:'Challenge progress · Just now',points:'+'+Math.round(c.points/c.goal)});m.visits++;save();render();toast(c.progress===c.goal?'Challenge complete! Points added 🎉':'Progress logged! Points added ✨')}
function redeem(id){let r=data.rewards.find(x=>x.id===id),m=member();if(!r||m.points<r.cost||!r.stock)return;m.points-=r.cost;r.stock--;data.redemptions.push({memberId:m.id,rewardId:r.id,date:new Date().toISOString()});data.activity.unshift({icon:r.icon,title:'Redeemed '+r.name,meta:'Reward claimed · Just now',points:'−'+r.cost});save();render();toast(`${r.name} redeemed. Show this to the front desk!`)}
function modal(title,sub,fields,onSave,saveText='Save'){let el=document.createElement('div');el.className='modal-back';el.innerHTML=`<div class="modal"><h2>${title}</h2><p>${sub}</p><form>${fields}<div class="modal-actions"><button class="secondary" type="button" onclick="this.closest('.modal-back').remove()">Cancel</button><button class="primary" type="submit">${saveText}</button></div></form></div>`;el.onclick=e=>{if(e.target===el)el.remove()};el.querySelector('form').onsubmit=e=>{e.preventDefault();let vals={};new FormData(e.target).forEach((v,k)=>vals[k]=v);onSave(vals);el.remove()};document.body.append(el)}
function openChallengeModal(){modal('Create a challenge','Give members a clear goal to work toward.',`<div class="field"><label>CHALLENGE NAME</label><input name="title" required placeholder="e.g. 10 visits this month"></div><div class="field"><label>SHORT DESCRIPTION</label><input name="desc" required placeholder="What should members do?"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>COMPLETIONS</label><input name="goal" type="number" min="1" value="3" required></div><div class="field"><label>POINTS</label><input name="points" type="number" min="1" value="100" required></div></div>`,v=>{data.challenges.unshift({id:Date.now(),title:v.title,desc:v.desc,icon:'🎯',goal:+v.goal,points:+v.points,progress:0,active:true});save();render();toast('Challenge created')},'Create challenge')}
function openRewardModal(old){modal(old?'Edit reward':'Add a reward',old?'Update the reward details.':'Add a new perk to your reward catalog.',`<div class="field"><label>REWARD NAME</label><input name="name" required placeholder="e.g. Free smoothie" value="${old?esc(old.name):''}"></div><div class="field"><label>DESCRIPTION</label><input name="desc" placeholder="A little something for showing up" value="${old?esc(old.desc):''}"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>POINT COST</label><input name="cost" type="number" min="1" value="${old?old.cost:250}" required></div><div class="field"><label>STOCK</label><input name="stock" type="number" min="0" value="${old?old.stock:10}" required></div></div>`,v=>{if(old)Object.assign(old,{name:v.name,desc:v.desc,cost:+v.cost,stock:+v.stock});else data.rewards.push({id:Date.now(),name:v.name,desc:v.desc,cost:+v.cost,stock:+v.stock,icon:'🎁'});save();render();toast(old?'Reward updated':'Reward added')})}
function openMemberModal(){modal('Add a member','Add someone to your club rewards program.',`<div class="field"><label>FULL NAME</label><input name="name" required placeholder="Member name"></div><div class="field"><label>EMAIL ADDRESS</label><input name="email" type="email" required placeholder="member@example.com"></div><div class="field"><label>STARTING POINTS</label><input name="points" type="number" min="0" value="100"></div>`,v=>{let initials=v.name.trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();data.members.push({id:Date.now(),name:v.name,email:v.email,points:+v.points,visits:0,tier:+v.points>=750?'Gold':+v.points>=350?'Silver':'Bronze',initials});save();render();toast('Member added')},'Add member')}
function adjustPoints(id){let m=data.members.find(x=>x.id===id);modal('Adjust points',`Change the balance for ${esc(m.name)}. Use a negative number to remove points.`,`<div class="field"><label>POINTS TO ADD OR REMOVE</label><input name="amount" type="number" required placeholder="e.g. 50 or -25"></div><div class="field"><label>NOTE</label><input name="note" placeholder="Reason for adjustment"></div>`,v=>{m.points=Math.max(0,m.points+(+v.amount));m.tier=m.points>=750?'Gold':m.points>=350?'Silver':'Bronze';data.activity.unshift({icon:'✳',title:'Staff points adjustment',meta:v.note||'Adjusted by staff · Just now',points:(v.amount>0?'+':'')+v.amount});save();render();toast('Member balance updated')},'Update balance')}
function editReward(id){openRewardModal(data.rewards.find(r=>r.id===id))}function deleteReward(id){let r=data.rewards.find(x=>x.id===id);if(confirm(`Remove “${r.name}” from the reward catalog?`)){data.rewards=data.rewards.filter(x=>x.id!==id);save();render();toast('Reward removed')}}
render();
</script><script>document.querySelector('.brand span').textContent='Progress Perks'</script>
<style>
.tier-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font:700 9px 'DM Mono';letter-spacing:.35px;text-transform:uppercase;white-space:nowrap}.tier-bronze{color:#8d542f;background:#fff0e4;border:1px solid #f2d5bc}.tier-silver{color:#526779;background:#edf2f7;border:1px solid #d8e1e9}.tier-gold{color:#836017;background:#fff5d7;border:1px solid #f1dfaa}

@media(max-width:700px){.tiers-grid{grid-template-columns:1fr}.tier-guide{margin-top:-8px}.member-select{max-width:120px;padding:7px 6px}.top-actions{gap:6px}.staff-created-note{white-space:normal;text-align:right;max-width:135px}.tier-guide-head{align-items:center}}
</style>
<script>
const TIER_RULES={Bronze:{min:0,bonus:0,discount:0,benefits:['Standard challenge points','Access to core rewards']},Silver:{min:350,bonus:10,discount:0,benefits:['10% extra points on challenges','Access to Silver rewards']},Gold:{min:750,bonus:25,discount:10,benefits:['25% extra points on challenges','Access to Gold rewards','10% off reward point prices']}};
const tierRank=t=>({Bronze:0,Silver:1,Gold:2}[t]??0);
function refreshTier(m){let earned=Number(m.lifetimePoints??m.points??0);m.lifetimePoints=earned;m.tier=earned>=750?'Gold':earned>=350?'Silver':'Bronze';return m.tier}
data.members.forEach(m=>refreshTier(m));
data.rewards.forEach(r=>{if(!r.minTier)r.minTier=r.id===2?'Silver':r.id===3?'Gold':'Bronze'});
save();
const renderBase=render;
render=function(){renderBase();decorateProgressPerks()};
const openChallengeBase=openChallengeModal;
openChallengeModal=function(){if(view!=='admin'){toast('Only staff can create challenges.');return}openChallengeBase()};
openRewardModal=function(old){let fields=`<div class="field"><label>REWARD NAME</label><input name="name" required placeholder="e.g. Free smoothie" value="${old?esc(old.name):''}"></div><div class="field"><label>DESCRIPTION</label><input name="desc" placeholder="A little something for showing up" value="${old?esc(old.desc):''}"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>POINT COST</label><input name="cost" type="number" min="1" value="${old?old.cost:250}" required></div><div class="field"><label>STOCK</label><input name="stock" type="number" min="0" value="${old?old.stock:10}" required></div></div><div class="field"><label>MINIMUM TIER TO REDEEM</label><select name="minTier"><option value="Bronze" ${!old||old.minTier==='Bronze'?'selected':''}>Bronze · Everyone</option><option value="Silver" ${old?.minTier==='Silver'?'selected':''}>Silver</option><option value="Gold" ${old?.minTier==='Gold'?'selected':''}>Gold</option></select></div>`;modal(old?'Edit reward':'Add a reward',old?'Update reward details and tier access.':'Choose who can redeem this reward.',fields,v=>{if(old)Object.assign(old,{name:v.name,desc:v.desc,cost:+v.cost,stock:+v.stock,minTier:v.minTier});else data.rewards.push({id:Date.now(),name:v.name,desc:v.desc,cost:+v.cost,stock:+v.stock,icon:'🎁',minTier:v.minTier});save();render();toast(old?'Reward updated':'Reward added')})};
redeem=function(id){let r=data.rewards.find(x=>x.id===id),m=member();if(!r)return;refreshTier(m);if(tierRank(m.tier)<tierRank(r.minTier||'Bronze')){toast(`This reward unlocks at ${r.minTier}.`);return}let cost=Math.ceil(r.cost*(1-(m.tier==='Gold'?TIER_RULES.Gold.discount/100:0)));if(m.points<cost||!r.stock)return;m.points-=cost;r.stock--;data.redemptions.push({memberId:m.id,rewardId:r.id,costPaid:cost,date:new Date().toISOString()});data.activity.unshift({icon:r.icon,title:'Redeemed '+r.name,meta:m.tier==='Gold'?'Gold reward discount applied · Just now':'Reward claimed · Just now',points:'−'+cost});save();render();toast(m.tier==='Gold'?`${r.name} redeemed with your 10% Gold discount!`:`${r.name} redeemed. Show this to the front desk!`)};
advanceChallenge=function(id){let c=data.challenges.find(x=>x.id===id),m=member();if(!c||c.progress>=c.goal)return;refreshTier(m);let base=Math.round(c.points/c.goal),bonus=Math.round(base*TIER_RULES[m.tier].bonus/100),earned=base+bonus;c.progress++;m.points+=earned;m.lifetimePoints+=earned;refreshTier(m);m.visits++;data.activity.unshift({icon:c.icon,title:c.title,meta:`Challenge progress · ${m.tier} tier bonus included · Just now`,points:'+'+earned});save();render();toast(c.progress===c.goal?`Challenge complete! +${earned} points with your tier bonus 🎉`:`Progress logged! +${earned} points including tier bonus ✨`)};
adjustPoints=function(id){let m=data.members.find(x=>x.id===id);modal('Adjust points',`Change the balance for ${esc(m.name)}. Use a negative number to remove points.`, `<div class="field"><label>POINTS TO ADD OR REMOVE</label><input name="amount" type="number" required placeholder="e.g. 50 or -25"></div><div class="field"><label>NOTE</label><input name="note" placeholder="Reason for adjustment"></div>`,v=>{let amount=+v.amount;m.points=Math.max(0,m.points+amount);if(amount>0)m.lifetimePoints=(m.lifetimePoints||0)+amount;refreshTier(m);data.activity.unshift({icon:'✳',title:'Staff points adjustment',meta:v.note||'Adjusted by staff · Just now',points:(amount>0?'+':'')+amount});save();render();toast('Member balance updated')},'Update balance')};
function decorateProgressPerks(){document.querySelector('.brand span')?.replaceChildren('Progress Perks');if(view==='member'){let m=member(),tier=refreshTier(m),bonus=TIER_RULES[tier].bonus,top=document.querySelector('.top-actions'),switcher=top?.querySelector('.switch');if(switcher){let sel=document.createElement('select');sel.className='member-select';sel.setAttribute('aria-label','Preview member');sel.innerHTML=data.members.map(x=>`<option value="${x.id}">${esc(x.name)} · ${refreshTier(x)}</option>`).join('');sel.value=String(m.id);sel.onchange=()=>{data.currentMember=Number(sel.value);save();render();toast(`Previewing ${member().name}`)};switcher.after(sel)}let note=document.querySelector('.score-note');if(note){let next=tier==='Bronze'?350:tier==='Silver'?750:null;note.innerHTML=`<span class="tier-badge tier-${tier.toLowerCase()}">${tier}</span> MEMBER · ${next?`${Math.max(0,next-m.lifetimePoints)} LIFETIME PTS TO NEXT TIER`:'TOP TIER'}`}let tierStat=document.querySelector('.stats .stat:nth-child(4) .stat-num');if(tierStat)tierStat.innerHTML=`<span class="tier-badge tier-${tier.toLowerCase()}">${tier}</span>`;let stats=document.querySelector('.stats');if(stats){let guide=document.createElement('section');guide.className='tier-guide';guide.innerHTML=`<div class="tier-guide-head"><div><h3>Your tier unlocks more as you move</h3><p>Tier is based on lifetime points earned. Redeeming rewards never lowers your tier.</p></div><span class="member-tier-note">CURRENT: <b>${tier}</b></span></div><div class="tiers-grid">${Object.entries(TIER_RULES).map(([name,rule])=>`<article class="tier-tile ${name===tier?'current':''}"><div class="tier-tile-top"><span class="tier-badge tier-${name.toLowerCase()}">${name}${name===tier?' · YOU':''}</span><span class="tier-threshold">${rule.min===0?'START':rule.min+' LIFETIME PTS'}</span></div><ul>${rule.benefits.map(b=>`<li>${b}</li>`).join('')}</ul></article>`).join('')}</div>`;stats.after(guide)}let heading=document.querySelector('.section-head#challenges');if(heading){let button=heading.querySelector('button');if(button)button.remove();let hint=document.createElement('span');hint.className='staff-created-note';hint.textContent='🔒 Challenges are created by staff';heading.append(hint)}document.querySelectorAll('.challenge').forEach((card,i)=>{let c=data.challenges.filter(x=>x.active)[i],points=card.querySelector('.reward-points');if(c&&points){let extra=Math.round(c.points*bonus/100);points.textContent=`+${c.points+extra} pts · ${bonus?`+${extra} ${tier} bonus`:'standard points'}`;points.title=`${c.points} base points plus ${extra} ${tier} tier bonus`}});document.querySelectorAll('.reward-list .reward').forEach((card,i)=>{let r=data.rewards[i];if(!r)return;let locked=tierRank(tier)<tierRank(r.minTier||'Bronze'),cost=Math.ceil(r.cost*(1-(tier==='Gold'?TIER_RULES.Gold.discount/100:0))),desc=card.querySelector('.reward-desc'),button=card.querySelector('.redeem');card.classList.toggle('locked',locked);if(desc){desc.textContent=locked?`${r.cost} pts · Requires ${r.minTier}`:tier==='Gold'?`${r.cost} pts → ${cost} Gold pts · ${r.stock} left`: `${r.cost} pts · ${r.stock} left`;if(locked){let gate=document.createElement('span');gate.className='reward-access';gate.textContent=`🔒 ${r.minTier} tier unlock`;desc.append(document.createElement('br'),gate)}}if(button){let enough=m.points>=cost&&r.stock>0;button.disabled=locked||!enough;button.textContent=locked?`${r.minTier} only`:r.stock===0?'Out of stock':!enough?'Need points':'Redeem'}})}else{document.querySelectorAll('tbody .tag').forEach((badge,i)=>{let m=data.members[i];if(m){badge.classList.remove('orange');badge.classList.add('tier-badge','tier-'+refreshTier(m).toLowerCase());badge.textContent=m.tier}});document.querySelectorAll('#manage-rewards .manage-row').forEach((row,i)=>{let r=data.rewards[i],small=row.querySelector('small');if(r&&small)small.textContent=`${r.cost} pts · ${r.stock} in stock · ${r.minTier||'Bronze'}+ access`});let banner=document.querySelector('.admin-banner');if(banner&&!document.querySelector('.tier-policy')){let policy=document.createElement('div');policy.className='tier-policy';policy.innerHTML='<b>Tier benefit rules:</b> Bronze earns standard challenge points. Silver earns 10% extra and unlocks Silver rewards. Gold earns 25% extra, unlocks Gold rewards, and gets 10% off reward point prices. Tiers use lifetime points earned.';banner.after(policy)}}}
render();
</script>
<style>
.grand-panel{border:1px solid #dbe9e4;background:linear-gradient(135deg,#f4faf7,#fff);border-radius:14px;padding:19px;margin:0 0 23px;box-shadow:0 4px 16px #1d465008}.grand-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.grand-kicker{font:500 9px 'DM Mono';letter-spacing:.9px;text-transform:uppercase;color:#6d9384}.grand-title{font:700 17px Manrope;margin:5px 0}.grand-copy{font-size:10px;line-height:1.55;color:#74837b;margin:0;max-width:560px}.grand-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.grand-chip{border:1px solid #e1ebe6;background:#fff;border-radius:999px;padding:5px 8px;font:9px 'DM Mono';color:#5c7268}.grand-layout{display:grid;grid-template-columns:.8fr 1.2fr;gap:17px;align-items:start;margin-top:15px}.grand-join{display:flex;flex-direction:column;gap:8px}.grand-join .primary,.grand-join .secondary{width:max-content}.grand-board{border:1px solid #e8efec;border-radius:10px;background:#fff;overflow:hidden}.grand-board-head{display:flex;justify-content:space-between;padding:9px 11px;background:#fbfdfc;color:#7f8d85;font:9px 'DM Mono';text-transform:uppercase}.grand-row{display:grid;grid-template-columns:25px 1fr auto;gap:8px;align-items:center;padding:9px 11px;border-top:1px solid #f0f3f1;font-size:10px}.grand-rank{color:#90a097;font:10px 'DM Mono'}.grand-name{font-weight:700}.grand-row-meta{color:#91a098;font-size:9px;margin-top:3px}.grand-score{font:700 11px 'DM Mono';color:#236b56}.grand-winner{padding:13px;background:#fff8dd;border:1px solid #f2e2ac;border-radius:10px;font-size:11px;color:#735c18;line-height:1.5}.grand-staff-actions{display:flex;gap:8px;flex-wrap:wrap}.inventory-summary{display:flex;gap:7px;flex-wrap:wrap;margin:-4px 0 10px}.inventory-chip{background:#f5f8f6;border:1px solid #e7eeea;border-radius:999px;padding:5px 8px;font:9px 'DM Mono';color:#66776d}.stock-state{display:inline-block;margin-top:4px;padding:3px 6px;border-radius:999px;background:#edf6f1;color:#547d66;font:8px 'DM Mono';text-transform:uppercase}.stock-state.low{background:#fff4df;color:#9b7634}.stock-state.out{background:#fdebea;color:#a24d4d}.small-btn.restock-btn{background:#f1f8f4;border-color:#dcece2;color:#377554}.admin-banner .tier-settings-btn{background:#fff;border:1px solid #dce7df;color:#4f7160}.grand-history-note{margin-top:8px;color:#86938b;font-size:9px}
@media(max-width:700px){.grand-layout{grid-template-columns:1fr}.grand-head{display:block}.grand-head>.grand-staff-actions{margin-top:10px}.grand-panel{padding:15px}.grand-title{font-size:15px}}
</style>
<script>
data.tierThresholds=data.tierThresholds||{Silver:750,Gold:1800};data.grandChallengeHistory=data.grandChallengeHistory||[];data.rewards.forEach(r=>{r.redeemedCount=Number(r.redeemedCount||0);r.reservedCount=Number(r.reservedCount||0)});
TIER_RULES.Silver.min=Number(data.tierThresholds.Silver||750);TIER_RULES.Gold.min=Number(data.tierThresholds.Gold||1800);
refreshTier=function(m){if(!Number.isFinite(m.seasonPoints)){let floor=m.tier==='Gold'?TIER_RULES.Gold.min:m.tier==='Silver'?TIER_RULES.Silver.min:0;m.seasonPoints=Math.max(Number(m.lifetimePoints??m.points??0),floor)}let s=Number(data.tierThresholds.Silver||750),g=Number(data.tierThresholds.Gold||1800);m.tier=m.seasonPoints>=g?'Gold':m.seasonPoints>=s?'Silver':'Bronze';return m.tier};data.members.forEach(refreshTier);save();
function currentGrand(){return data.grandChallenge||null}function grandReward(g){return data.rewards.find(r=>r.id===g?.prizeId)}function grandEndLabel(g){return g?.endAt?new Date(g.endAt).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—'}
function joinGrandChallenge(){let g=currentGrand(),m=member();if(view!=='member'||!g||g.status!=='active')return;if(g.participants?.[m.id]){toast('You are already on the leaderboard');return}g.participants=g.participants||{};let now=new Date().toISOString();g.participants[m.id]={points:0,joinedAt:now,reachTimes:{'0':now}};save();render();toast('You joined the Grand Challenge leaderboard!')}
function startGrandChallenge(){if(view!=='admin'){toast('Only staff can start a Grand Challenge.');return}if(currentGrand()?.status==='active'){toast('End the current Grand Challenge before starting another.');return}let available=data.rewards.filter(r=>r.stock>0);if(!available.length){toast('Add or restock a reward before setting a Grand Challenge prize.');return}let fields=`<div class="field"><label>GRAND CHALLENGE NAME</label><input name="title" required placeholder="e.g. Summit Showdown"></div><div class="field"><label>CHALLENGE LENGTH</label><select name="period"><option value="weekly">Weekly · 7 days</option><option value="monthly">Monthly · 1 calendar month</option></select></div><div class="field"><label>WINNER'S PRIZE · 1 ITEM WILL BE RESERVED</label><select name="prizeId" required>${available.map(r=>`<option value="${r.id}">${esc(r.name)} · ${r.stock} available</option>`).join('')}</select></div>`;modal('Start a Grand Challenge','Members join the board and earn score from logged challenge progress. The top scorer wins the reserved reward.',fields,v=>{let prize=data.rewards.find(r=>r.id===+v.prizeId);if(!prize||prize.stock<1){toast('That reward is no longer in stock.');return}if(data.grandChallenge?.status==='ended')data.grandChallengeHistory.unshift(data.grandChallenge);prize.stock--;prize.reservedCount=(prize.reservedCount||0)+1;let start=new Date(),end=new Date(start);if(v.period==='weekly')end.setDate(end.getDate()+7);else end.setMonth(end.getMonth()+1);data.grandChallenge={id:Date.now(),title:v.title,period:v.period,prizeId:prize.id,startAt:start.toISOString(),endAt:end.toISOString(),status:'active',participants:{}};save();render();toast(`${v.period==='weekly'?'Weekly':'Monthly'} Grand Challenge is live!`)},'Start challenge')}
function closeGrandChallenge(){if(view!=='admin'){toast('Only staff can close a Grand Challenge.');return}let g=currentGrand();if(!g||g.status!=='active')return;modal('Close and award the Grand Challenge?',`This will award the reserved prize to the top scorer and reset every member's tier progress to Bronze. Spendable reward points stay in each member's balance.`, `<p class="grand-history-note">Tie-break: the member who reached the final score first wins.</p>`,()=>{let entries=Object.entries(g.participants||{}).map(([id,p])=>({id:+id,points:Number(p.points||0),p})).filter(x=>x.points>0).sort((a,b)=>b.points-a.points||new Date(a.p.reachTimes?.[String(a.points)]||a.p.joinedAt)-new Date(b.p.reachTimes?.[String(b.points)]||b.p.joinedAt));let winner=entries[0]||null,r=grandReward(g);if(winner&&!r){toast('The reserved prize could not be found.');return}if(r){r.reservedCount=Math.max(0,(r.reservedCount||0)-1);if(winner)r.redeemedCount=(r.redeemedCount||0)+1;else r.stock++}g.status='ended';g.endedAt=new Date().toISOString();g.winnerId=winner?.id||null;g.winnerPoints=winner?.points||0;g.winnerName=winner?data.members.find(m=>m.id===winner.id)?.name:null;data.grandChallengeHistory.unshift({...g});data.members.forEach(m=>{m.seasonPoints=0;refreshTier(m)});if(winner)data.activity.unshift({icon:'🏆',title:`Grand Challenge winner: ${g.winnerName}`,meta:`${r.name} awarded · Tiers reset to Bronze`,points:`${winner.points} pts`});save();render();toast(winner?`${g.winnerName} wins ${r.name}! Tier progress reset.`:'Challenge closed with no scored participants. Prize returned; tiers reset.')},'Close & award')}
function setTierRequirements(){if(view!=='admin'){toast('Only staff can change tier requirements.');return}let s=data.tierThresholds.Silver,g=data.tierThresholds.Gold;modal('Tier point requirements','Set the season points required to reach each tier. Tiers reset to Bronze after each Grand Challenge closes.',`<div class="field"><label>SILVER · SEASON POINTS</label><input name="silver" type="number" min="1" value="${s}" required></div><div class="field"><label>GOLD · SEASON POINTS</label><input name="gold" type="number" min="2" value="${g}" required></div>`,v=>{let silver=+v.silver,gold=+v.gold;if(!Number.isFinite(silver)||!Number.isFinite(gold)||silver<1||gold<=silver){toast('Gold must require more points than Silver. Reopen settings to try again.');return}data.tierThresholds={Silver:silver,Gold:gold};TIER_RULES.Silver.min=silver;TIER_RULES.Gold.min=gold;data.members.forEach(refreshTier);save();render();toast('Tier requirements updated')},'Save tiers')}
function restockReward(id){let r=data.rewards.find(x=>x.id===id);if(!r)return;r.stock+=5;save();render();toast(`${r.name} restocked by 5`)}
function finalizeGrandOrder(){let g=currentGrand(),m=member();if(!g||g.status!=='active')return[];return Object.entries(g.participants||{}).map(([id,p])=>({id:+id,points:Number(p.points||0),p,name:data.members.find(x=>x.id===+id)?.name||'Member'})).sort((a,b)=>b.points-a.points||new Date(a.p.reachTimes?.[String(a.points)]||a.p.joinedAt)-new Date(b.p.reachTimes?.[String(b.points)]||b.p.joinedAt))}
advanceChallenge=function(id){let c=data.challenges.find(x=>x.id===id),m=member();if(!c||c.progress>=c.goal)return;refreshTier(m);let base=Math.round(c.points/c.goal),bonus=Math.round(base*TIER_RULES[m.tier].bonus/100),earned=base+bonus;c.progress++;m.points+=earned;m.seasonPoints+=earned;refreshTier(m);m.visits++;let g=currentGrand();if(g?.status==='active'&&g.participants?.[m.id]){let p=g.participants[m.id];p.points=(p.points||0)+earned;p.reachTimes=p.reachTimes||{};p.reachTimes[String(p.points)]=new Date().toISOString()}data.activity.unshift({icon:c.icon,title:c.title,meta:`Challenge progress · +${earned} points · Just now`,points:'+'+earned});save();render();toast(c.progress===c.goal?`Challenge complete! +${earned} points with your tier bonus 🎉`:`Progress logged! +${earned} points including tier bonus ✨`)};
redeem=function(id){let r=data.rewards.find(x=>x.id===id),m=member();if(!r)return;refreshTier(m);if(tierRank(m.tier)<tierRank(r.minTier||'Bronze')){toast(`This reward unlocks at ${r.minTier}.`);return}let cost=Math.ceil(r.cost*(1-(m.tier==='Gold'?TIER_RULES.Gold.discount/100:0)));if(m.points<cost||!r.stock)return;m.points-=cost;r.stock--;r.redeemedCount=(r.redeemedCount||0)+1;data.redemptions.push({memberId:m.id,rewardId:r.id,costPaid:cost,date:new Date().toISOString()});data.activity.unshift({icon:r.icon,title:'Redeemed '+r.name,meta:m.tier==='Gold'?'Gold reward discount applied · Just now':'Reward claimed · Just now',points:'−'+cost});save();render();toast(m.tier==='Gold'?`${r.name} redeemed with your 10% Gold discount!`:`${r.name} redeemed. Show this to the front desk!`)};
adjustPoints=function(id){let m=data.members.find(x=>x.id===id);modal('Adjust points',`Change the balance for ${esc(m.name)}. Use a negative number to remove points.`,`<div class="field"><label>POINTS TO ADD OR REMOVE</label><input name="amount" type="number" required placeholder="e.g. 50 or -25"></div><div class="field"><label>NOTE</label><input name="note" placeholder="Reason for adjustment"></div>`,v=>{let amount=+v.amount;m.points=Math.max(0,m.points+amount);if(amount>0)m.seasonPoints=(m.seasonPoints||0)+amount;refreshTier(m);data.activity.unshift({icon:'✳',title:'Staff points adjustment',meta:v.note||'Adjusted by staff · Just now',points:(amount>0?'+':'')+amount});save();render();toast('Member balance updated')},'Update balance')};
const decorateTierBase=decorateProgressPerks;
decorateProgressPerks=function(){decorateTierBase();data.members.forEach(refreshTier);if(view==='member'){let m=member(),tier=m.tier,scoreNote=document.querySelector('.score-note'),next=tier==='Bronze'?data.tierThresholds.Silver:tier==='Silver'?data.tierThresholds.Gold:null;if(scoreNote)scoreNote.innerHTML=`<span class="tier-badge tier-${tier.toLowerCase()}">${tier}</span> MEMBER · ${next?`${Math.max(0,next-m.seasonPoints)} SEASON PTS TO NEXT TIER`:'TOP TIER'}`;let tierNote=document.querySelector('.tier-guide-head p');if(tierNote)tierNote.textContent='Tier progress resets to Bronze when each Grand Challenge closes. Your spendable reward point balance stays.';let board=document.querySelector('.tier-guide');if(board){let old=board.querySelector('.tier-guide-head .member-tier-note');if(old)old.textContent=`SEASON POINTS: ${m.seasonPoints||0}`}let joinPoint=board||document.querySelector('.stats');if(joinPoint&&!document.querySelector('.grand-panel'))joinPoint.after(buildGrandPanel(false));}else{let policy=document.querySelector('.tier-policy');if(policy)policy.innerHTML=`<b>Tier rules:</b> Silver at ${data.tierThresholds.Silver} season points; Gold at ${data.tierThresholds.Gold}. Bronze earns standard challenge points, Silver earns 10% extra, and Gold earns 25% extra plus 10% off reward point prices. Tier progress resets when a Grand Challenge closes.`;let banner=document.querySelector('.admin-banner');if(banner&&!banner.querySelector('.tier-settings-btn')){let b=document.createElement('button');b.className='primary tier-settings-btn';b.textContent='Tier requirements';b.onclick=setTierRequirements;banner.append(b)}let adminStats=document.querySelector('.admin-stats');if(adminStats&&!document.querySelector('.grand-panel'))adminStats.after(buildGrandPanel(true));let rows=document.querySelectorAll('#manage-rewards .manage-row');rows.forEach((row,i)=>{let r=data.rewards[i],small=row.querySelector('small'),actions=row.querySelector('.row-actions');if(!r||!small)return;small.textContent=`${r.stock} available · ${r.reservedCount||0} reserved · ${r.redeemedCount||0} redeemed · ${r.minTier||'Bronze'}+`;let state=row.querySelector('.stock-state');if(!state){state=document.createElement('span');state.className='stock-state';small.after(state)}state.className='stock-state '+(r.stock===0?'out':r.stock<=5?'low':'');state.textContent=r.stock===0?'Out of stock':r.stock<=5?'Low stock':'In stock';if(actions&&!actions.querySelector('.restock-btn')){let b=document.createElement('button');b.className='small-btn restock-btn';b.textContent='+5';b.title='Restock five items';b.onclick=()=>restockReward(r.id);actions.prepend(b)}});let panel=document.querySelector('#manage-rewards');if(panel&&!panel.querySelector('.inventory-summary')){let items=data.rewards.reduce((a,r)=>({available:a.available+r.stock,reserved:a.reserved+(r.reservedCount||0),awarded:a.awarded+(r.redeemedCount||0)}),{available:0,reserved:0,awarded:0}),summary=document.createElement('div');summary.className='inventory-summary';summary.innerHTML=`<span class="inventory-chip">${items.available} available</span><span class="inventory-chip">${items.reserved} reserved for prizes</span><span class="inventory-chip">${items.awarded} redeemed / awarded</span>`;panel.querySelector('.panel-title').after(summary)}}};
function buildGrandPanel(isStaff){let g=currentGrand(),panel=document.createElement('section');panel.className='grand-panel';let r=grandReward(g);if(!g){panel.innerHTML=`<div class="grand-head"><div><div class="grand-kicker">WEEKLY / MONTHLY · MEMBER LEADERBOARD</div><h3 class="grand-title">The Grand Challenge</h3><p class="grand-copy">${isStaff?'Launch a recurring leaderboard challenge and reserve a reward for the winner.':'There is no Grand Challenge running right now. Staff will announce the next round.'}</p></div>${isStaff?'<div class="grand-staff-actions"><button class="primary" onclick="startGrandChallenge()">＋ Start Grand Challenge</button></div>':''}</div>`;return panel}let rows=finalizeGrandOrder(),participant=!isStaff&&g.participants?.[member().id],dateLabel=grandEndLabel(g);panel.innerHTML=`<div class="grand-head"><div><div class="grand-kicker">${g.status==='active'?'LIVE GRAND CHALLENGE':'GRAND CHALLENGE COMPLETE'}</div><h3 class="grand-title">${esc(g.title)}</h3><p class="grand-copy">${g.status==='active'?`Join the ${g.period} leaderboard. Points from logged challenge progress count toward the prize.`:`Tiers have reset to Bronze for the next tier season.`}</p><div class="grand-meta"><span class="grand-chip">${g.period.toUpperCase()} ROUND</span><span class="grand-chip">🏆 ${esc(r?.name||'Reward unavailable')}</span>${g.status==='active'?`<span class="grand-chip">ENDS ${dateLabel}</span>`:`<span class="grand-chip">ENDED ${new Date(g.endedAt||g.endAt).toLocaleDateString()}</span>`}</div></div>${isStaff&&g.status==='active'?`<div class="grand-staff-actions"><button class="secondary" onclick="closeGrandChallenge()">Close & award winner</button></div>`:isStaff&&g.status==='ended'?`<div class="grand-staff-actions"><button class="primary" onclick="startGrandChallenge()">＋ Start next round</button></div>`:''}</div>${g.status==='ended'?`<div class="grand-layout"><div class="grand-winner">${g.winnerId?`🏆 <b>${esc(g.winnerName||'Winner')}</b> won ${esc(r?.name||'the prize')} with ${g.winnerPoints} points.`:'No one scored in this round, so the prize returned to inventory.'}<div class="grand-history-note">All members' tiers reset to Bronze. Spendable reward point balances remain unchanged.</div></div>${buildLeaderboard(rows,g)}</div>`:`<div class="grand-layout"><div class="grand-join">${isStaff?`<p class="grand-copy">${Object.keys(g.participants||{}).length} member${Object.keys(g.participants||{}).length===1?'':'s'} joined. Closing awards the prize to the top scorer and resets tier progress.</p>`:participant?`<span class="tier-badge tier-${member().tier.toLowerCase()}">YOU'RE IN · ${member().tier}</span><p class="grand-copy">Complete a challenge to add points to your Grand Challenge score.</p>`:`<p class="grand-copy">Join the leaderboard, then log your challenge progress to compete for ${esc(r?.name||'the prize')}.</p><button class="primary" onclick="joinGrandChallenge()">Join the leaderboard</button>`}<div class="grand-history-note">Tier points count for all members. Leaderboard score counts only after joining. Ties go to the first to reach the final score.</div></div>${buildLeaderboard(rows,g)}</div>`}`;return panel}
function buildLeaderboard(rows,g){if(!rows.length)return `<div class="grand-board"><div class="grand-board-head"><span>Leaderboard</span><span>Points</span></div><div class="empty">${g.status==='active'?'No members have joined yet.':'No leaderboard entries.'}</div></div>`;return `<div class="grand-board"><div class="grand-board-head"><span>Leaderboard · ${rows.length} competing</span><span>Score</span></div>${rows.map((row,i)=>`<div class="grand-row"><span class="grand-rank">${i===0&&row.points>0?'🏆':String(i+1).padStart(2,'0')}</span><div><div class="grand-name">${esc(row.name)}${row.id===member().id&&!viewIsStaff()?' · You':''}</div><div class="grand-row-meta">${refreshTier(data.members.find(m=>m.id===row.id)||{seasonPoints:0})} tier${row.points===0?' · joined':''}</div></div><span class="grand-score">${row.points} pts</span></div>`).join('')}</div>`}
function viewIsStaff(){return view==='admin'}
const deleteRewardBase=deleteReward;deleteReward=function(id){let g=currentGrand(),r=data.rewards.find(x=>x.id===id);if(g?.status==='active'&&g.prizeId===id){toast('This reward is reserved for the active Grand Challenge.');return}deleteRewardBase(id)};
